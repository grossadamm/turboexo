backend = "xrender";
vsync = false;
use-damage = true;
detect-client-opacity = true;

# TSDash remains mapped and paints into its Composite off-screen buffer, but
# none of its startup/loading windows can cover the MPV boot overlay.
rules = (
  {
    match = "class_g = 'ecuhubdash-EcuHubDash' && ! _NET_WM_WINDOW_OPACITY";
    opacity = 0.0;
    unredir = false;
  },
  {
    # Java's native splash is an override-redirect window with no WM_CLASS.
    match = "override_redirect && name = 'Java'";
    opacity = 0.0;
    unredir = false;
  },
  {
    match = "name = 'TurboExo Boot'";
    unredir = false;
  }
);
